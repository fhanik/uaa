ratelimit:
  #loggingOption: AllCallsWithDetails
  loggingOption: AllCalls
  #loggingOption: OnlyLimited
  # OnlyLimited is the default

  credentialID: 'JWT:Claims+"email"\s*:\s*"(.*?)"'

  limiterMappings:
    - name: Info
      withCallerRemoteAddressID: 1r/s
      pathSelectors:
        - "equals:/info"
        - "pathPattern:/z/{subdomain}/info"
    - name: Authenticate
      withCallerRemoteAddressID: 5r/s
      pathSelectors:
        - "equals:/authenticate"
        - "pathPattern:/z/{subdomain}/authenticate"
    - name: AuthToken
      withCallerRemoteAddressID: 2r/s
      pathSelectors:
        - "equals:/oauth/token"
        - "pathPattern:/z/{subdomain}/oauth/token"
    - name: AuthAuthorize
      withCallerRemoteAddressID: 1r/s
      pathSelectors:
        - "equals:/oauth/authorize"
        - "pathPattern:/z/{subdomain}/oauth/authorize"
    - name: LoginPage
      withCallerRemoteAddressID: 3r/3s
      global: 25r/s
      pathSelectors:
        - "equals:/login"
        - "pathPattern:/z/{subdomain}/login"
    - name: LoginResource
      withCallerRemoteAddressID: 12r/3s
      pathSelectors:
        - "startsWith:/resources/"
        - "startsWith:/vendor/"
        - "pathPattern:/z/{subdomain}/resources/**"
        - "pathPattern:/z/{subdomain}/vendor/**"
    - name: LoginDo
      withCallerRemoteAddressID: 2r/s
      global: 50r/s
      pathSelectors:
        - "equals:/login.do"
        - "pathPattern:/z/{subdomain}/login.do"
    - name: EverythingElse
      withCallerCredentialsID: 50r/s
      withCallerRemoteAddressID: 50r/s
      global: 250r/s
      pathSelectors:
        - "other"
